<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./dist/styles/main.css">
</head>
<body>
    <section class="hero">
        <div class="hero__content">
            <h1 class="hero__title">
                <img class="hero__branding" src="dist/images/disneyplus.svg" alt="Logo Disney Plus">
            </h1>
            <h2 class="title--small">As melhores histórias em um lugar só</h2>
            <a href="#" class="link-text">Assinar o Disney+</a>
            <p class="text">R$27,90/mês ou R$279,90/ano à vista*</p>
            <ul class="hero__combos">
                <li class="hero__combo">
                    <img src="dist/images/logos/disney_star_plus.png" alt="Combo Disney+ e Star+">
                    <button>ASSINE AGORA</button>
                    <p class="text">R$45,90/mês</p>
                </li>
                <li class="hero__combo">
                    <img src="dist/images/logos/disney_star_plus.png" alt="">
                    <button>ASSINE AGORA</button>
                    <p class="text">R$45,90/mês</p>
                </li>
            </ul>
            <p class="text--small">*O preço pode variar caso a assinatura seja feita através de outras plataformas.</p>
        </div>
    </section>
</body>
</html>
